","file":"src/interview_app/llm/client.py","line":29,"params":[],"symbol":"interview_app.llm.client:CallRecord"}],"config":"Bound per user and session by make_llm / make_decider in app/ui_common.py and interview_app.lab.compare:make_lab.","cost":"One small insert per model call.","id":"llmcall-log","input":"A CallRecord (role, model, prompt_tokens, completion_tokens, cost_usd, latency_s, ok, error) produced by LLMClient.chat or DecisionClient.decide, plus the user_id and session_id the recorder was bound to when it was built.","kind":"record","logging":"This is the log.","message":["LLMCall row: user_id, session_id, role (interviewer / planner / judge / candidate_sim / guard / live_score / lab_judge), model, prompt_tokens, completion_tokens, cost_usd, latency_s, ok, error"],"name":"LLMCall cost log","output":"A committed row in the llmcall table.","purpose":"One row per model call, so cost, tokens, latency and failures are visible per user and per interview, and so the per-session budget can be enforced from real charged cost.","result_use":"interview_app.interview.engine:session_cost sums cost_usd per session for the budget limit; the lab's spend_since sums it per run for --budget-usd; code_metrics reads interviewer and planner rows for cost per prompt variant.","symbols":["interview_app.llm.calllog:make_db_recorder","interview_app.llm.client:CallRecord"],"validation":"Each record is written in its own session_scope; a write failure raises into the model call's caller. Judge runs buffer their records and write them after all threads finish (SQLite single writer)."},{"_locs":[{"doc":"","file":"lab/compare_prompts.py","line":47,"params":["argv","lab","results_dir"],"symbol":"lab.compare_prompts:main"},{"doc":"Run every arm x persona x repeat. Returns (results, aborted_on_budget).","file":"src/interview_app/lab/compare.py","line":83,"params":["deps","decider","user_id","app_id","arms","personas","sessions_per_persona","budget_usd","max_candidate_turns","progress"],"symbol":"interview_app.lab.compare:run_arms"},{"doc":"§12 gate over all test sessions of one variant. I4 (coverage) is not measured in the lab, so the gate here is the part of §12 the transcripts allow; the doc says so too.","file":"src/interview_app/lab/judge.py","line":279,"params":["results"],"symbol":"interview_app.lab.judge:release_gate"}],"config":"Same Settings as the app; its own lab database file.","cost":"Real API calls; bounded by --budget-usd.","id":"bg-lab-compare-prompts","input":"CLI flags such as --variants, --personas, --sessions-per-persona and --budget-usd.","kind":"background","logging":"stdout progress; LLMCall rows in the lab database.","message":["make_lab, then run_arms over one Arm per prompt variant","per session: run_session (candidate simulator vs interviewer), load_session, code_metrics, judge_session","write_csv to lab/results and print markdown summaries"],"name":"Lab script: compare the five interviewer prompts","output":"A CSV row per session and a summary per variant, including the release_gate verdict.","purpose":"The command-line experiment behind course requirement R4: every interviewer prompt variant (p1-p5) interviews every simulated persona on the sample application, each transcript is judged by Jev and measured in code, and the results are written as a CSV and summary tables. Started by hand; nothing schedules it.","result_use":"Evidence for which interviewer prompt the app should use by default.","symbols":["lab.compare_prompts:main","interview_app.lab.compare:run_arms","interview_app.lab.judge:release_gate"],"validation":"Same budget check, skip-on-failure and leftover-session cleanup as the sweep script (shared run_arms / make_lab)."},{"_locs":[{"doc":"","file":"src/interview_app/interview/engine.py","line":421,"params":["deps","row","turns","force_close"],"symbol":"interview_app.interview.engine:_interviewer_turn"},{"doc":"","file":"src/interview_app/interview/engine.py","line":372,"params":["deps","row","config","turns","progress","directive"],"symbol":"interview_app.interview.engine:_messages"},{"doc":"","file":"src/interview_app/interview/prompting.py","line":113,"params":["ctx"],"symbol":"interview_app.interview.prompting:interviewer_system_prompt"},{"doc":"","file":"src/interview_app/interview/prompting.py","line":137,"params":["main_asked","main_target","followups","max_followups","candidate_turns","directive"],"symbol":"interview_app.interview.prompting:control_message"}],"config":"Model: SessionConfig.llm.model, else Settings.models.interviewer (env MODELS__INTERVIEWER). temperature, max_tokens, reasoning_effort from SessionConfig.llm (LLMSettings, set per session; reasoning_effort defaults to low). Limits from Settings.limits (env LIMITS__MAX_TURNS, LIMITS__MAX_SESSION_COST_USD).","cost":"Counted per session by session_cost; once it reaches Settings.limits.max_session_cost_usd, must_close forces the closing turn.","id":"model-interviewer","input":"System prompt from prompts/interviewer_<variant>.md (p1_zero_shot, p2_few_shot, p3_cot_plan, p4_role_rich, p5_self_critique), each including _base.md, _documents.md and _contract.md. Variables: persona, type_label, difficulty, max_followups, data_note, answer_note, documents (company/role and each document wrapped as untrusted data), missing, fields (from the turn schema), guideline (sections of Settings.guideline_path, used by P4), plan_json (the planner's plan, P4 only), focus / focus_block (weak-spot drill targets). Closing status from prompts/control.md: main_asked, main_target, followups, max_followups, candidate_turns, directive.","kind":"model","logging":"LLMCall rows with role 'interviewer', bound to the user and session through deps.make_llm.","message":["system: the rendered interviewer_<variant>.md — persona, rules, wrapped documents, JSON output contract","user: '(The candidate has joined the interview.)' — opening turn only, because Anthropic and Gemini reject a request with no user message","assistant / user, alternating for every kept turn: earlier interviewer turns as the JSON they were answered in (including private notes/draft fields), candidate answers wrapped with wrap_answer","system (last): control.md — counts computed by the app and the directive for this turn; kept last so the long system prompt stays byte-identical and cacheable"],"name":"Model role: interviewer","output":"TURN_SCHEMA[variant]: InterviewerTurn for P1/P2/P4 (stage, question_id, is_followup, message, is_final); CotTurn for P3 (notes first, then the same fields); CritiqueTurn for P5 (draft, critique, then the same fields with the corrected message).","purpose":"Writes the interviewer's next turn: what to say to the candidate, and the stage / question id / follow-up / final flags the app uses to track progress. Code decides the phase (next_directive); the model chooses the wording and whether the last answer needs a follow-up.","result_use":"_add_turn stores a Turn row: message as text, stage / question_id / is_followup / is_final as columns, private fields (notes, draft, critique) in private_json. is_final sets the session status to finished.","symbols":["interview_app.interview.engine:_interviewer_turn","interview_app.interview.engine:_messages","interview_app.interview.prompting:interviewer_system_prompt","interview_app.interview.prompting:control_message"],"validation":"chat_json with one JSON repair round. If the model sets is_final before the candidate-questions stage (and the app did not force a close), the engine asks once more with a corrective directive and forces is_final false. When force_close is set (turn or budget limit reached), is_final is set true in code whatever the model said. LLMError or ValidationError becomes InterviewError('The interviewer could not respond')."},{"_locs":[{"doc":"","file":"src/interview_app/interview/plan.py","line":13,"params":["llm","settings","company","role","documents","config"],"symbol":"interview_app.interview.plan:make_plan"},{"doc":"","file":"src/interview_app/interview/prompting.py","line":158,"params":["company","role","documents","config"],"symbol":"interview_app.interview.prompting:plan_messages"}],"config":"Settings.models.planner (env MODELS__PLANNER). reasoning_effort is hard-coded to 'low' in make_plan (measured faster and cheaper for the same plan structure); no temperature or max_tokens is sent.","cost":"Counted in the session's cost; the comment in make_plan records about $0.006 and ~21 s at low effort on the sample application.","id":"model-planner","input":"prompts/plan.md (includes _documents.md). Variables: type_label, main_questions, data_note, documents (company/role and each document wrapped as untrusted data), missing, focus, focus_block.","kind":"model","logging":"LLMCall row with role 'planner', billed to the new session.","message":["system: 'You are an experienced interviewer preparing for an interview.' (fixed text in plan_messages)","user: the rendered plan.md with the wrapped documents"],"name":"Model role: interview planner","output":"InterviewPlan: role_summary, requirements[] (id, text, priority, category, coverage, evidence), probes[] (focus, requirement_ids, stage, why), cv_numbers_to_verify, timeline_flags, motivation_claims.","purpose":"One call before the interview (prompt chaining) turns the job description, CV and cover letter into an InterviewPlan: the key requirements, how well the documents cover each, and an ordered list of probes. Only the P4 prompt variant uses it (USES_PLAN).","result_use":"Stored as InterviewSession.plan_json; plan_block wraps it as untrusted data for the P4 interviewer prompt, and the judge receives its requirements list (_requirements_block).","symbols":["interview_app.interview.plan:make_plan","interview_app.interview.prompting:plan_messages"],"validation":"chat_json with one JSON repair round. Any failure in start_interview marks the new session 'failed' (so it cannot block the next start) and raises InterviewError."},{"_locs":[{"doc":"`temperature` comes from rubric.json judge_settings (0: the same transcript should score the same).","file":"src/interview_app/evaluation/judge.py","line":95,"params":["llm","settings","messages","model","temperature"],"symbol":"interview_app.evaluation.judge:run_judge"},{"doc":"","file":"src/interview_app/evaluation/judge.py","line":47,"params":["rubric","company","role","documents","exchanges","plan"],"symbol":"interview_app.evaluation.judge:judge_messages"},{"doc":"","file":"src/interview_app/evaluation/service.py","line":55,"params":["deps","user_id","session_id","judge_model","force"],"symbol":"interview_app.evaluation.service:evaluate_session"}],"config":"Model: the judge_model argument (from the UI), else Settings.models.judge (env MODELS__JUDGE). temperature from rubric.json judge_settings.temperature; max_tokens from Settings.judge_max_tokens (env JUDGE_MAX_TOKENS). Runs per report: Settings.judge_runs (env JUDGE_RUNS), else rubric.json judge_settings.runs; reduced to 1 when the session is already over budget.","cost":"One call per run (default rubric runs); not otherwise measured.","id":"model-judge","input":"prompts/judge.md. Variables: exchange_items (name, item text without the decision-model prefix, criteria per level from docs/rubric.json), session_items (S1, S3, S4), requirement_options (S2 options), requirements_block (the plan's requirements, wrapped as data, or empty), documents (wrapped), exchanges (id, category, applicable items, turns with ids — candidate turns wrapped with wrap_answer, interviewer turns wrapped as interviewer_turn data), data_note, answer_note.","kind":"model","logging":"LLMCall rows with role 'judge'; each run's records are buffered and written from the calling thread after all runs finish, including failed runs.","message":["user: the whole rendered judge.md — instructions, rubric, documents and the transcript grouped into exchanges (there is no system message)"],"name":"Model role: final judge (LLM-as-a-judge)","output":"Judgement: exchanges[] (exchange_id, items[] of ItemScore {item, rationale, evidence turn ids, score 1-5 or null}), session_items[], requirements[] (requirement, priority, rationale, evidence, quote, level), strengths[] (point, evidence, quote), improvements[], better_answer, summary.","purpose":"Scores the whole finished interview against the rubric in one call: 1-5 per applicable item for every exchange, the session items S1/S3/S4, requirement evidence (S2), strengths, improvements, one better answer and a summary. Code then turns these into the report's numbers.","result_use":"Each run is aggregated separately; median_run picks the run whose overall score is the median, and its numbers plus written feedback become the Report stored in the Evaluation row (an older report for the session is replaced).","symbols":["interview_app.evaluation.judge:run_judge","interview_app.evaluation.judge:judge_messages","interview_app.evaluation.service:evaluate_session"],"validation":"chat_json with one JSON repair round (none if the reply was cut at max_tokens). The runs execute in parallel; a run that fails with LLMError or ValidationError is dropped, and only when all runs fail does evaluate_session raise EvaluationError. aggregate then ignores scores for non-applicable items, scores without evidence from that exchange's own candidate turns (when judge_settings.evidence_required), and requirement or strength quotes that are not found in the cited turns."},{"_locs":[{"doc":"Check one interview answer. A hit blocks it (the candidate is asked to rephrase).","file":"src/interview_app/security/injection.py","line":250,"params":["self","text"],"symbol":"interview_app.security.injection:InjectionGuard.check_answer"},{"doc":"Check one document (JD, CV, cover letter, notes). Never blocks; flags it for the user.","file":"src/interview_app/security/injection.py","line":287,"params":["self","kind","text"],"symbol":"interview_app.security.injection:InjectionGuard.check_document"},{"doc":"The Jev yes/no question about `state[field]`.","file":"src/interview_app/security/injection.py","line":185,"params":["field"],"symbol":"interview_app.security.injection:injection_question"},{"doc":"Ask one or more questions about `state` in a single request.","file":"src/interview_app/llm/decide.py","line":183,"params":["self","role","state","questions","model"],"symbol":"interview_app.llm.decide:DecisionClient.decide"}],"config":"Settings.models.jev (env MODELS__JEV); Settings.guard.injection_threshold (env GUARD__INJECTION_THRESHOLD), Settings.guard.use_model_check (env GUARD__USE_MODEL_CHECK), Settings.guard.document_chunk_chars, Settings.guard.max_document_chunks.","cost":"One Jev request per answer and one per document check; per-call cost is reported by the API.","id":"model-guard-jev","input":"No template file: the question is built in code by injection_question (instructions plus true/false criteria that name interview answers and job documents as ordinary content). State: {text: canonical(answer)} for an answer; {document_kind, chunk_0 ... chunk_n} for a document split by split_into_chunks.","kind":"model","logging":"LLMCall rows with role 'guard'; Python log lines for blocked answers and flagged documents (the blocked text itself is never stored).","message":["POST Decisions API body: model, state (the canonicalised text or chunks), questions — one 'noul' (yes/no) question per field: 'injection' for an answer, chunk_<i> for each document chunk, all in one request"],"name":"Model role: injection guard (Jev)","output":"NoulAnswer.p_true per question, a probability 0-1.","purpose":"Second layer of the prompt-injection guard (after the regex rules): Jev returns the probability that a candidate answer or a document chunk tries to instruct or manipulate an AI. The model only gives the probability; code compares it to the threshold.","result_use":"check_answer: p >= threshold blocks the answer (the candidate is asked to rephrase). check_document: p >= threshold (max over chunks) adds model:injection to the checks, and the document is flagged for the user to confirm or edit — never blocked.","symbols":["interview_app.security.injection:InjectionGuard.check_answer","interview_app.security.injection:InjectionGuard.check_document","interview_app.security.injection:injection_question","interview_app.llm.decide:DecisionClient.decide"],"validation":"DecisionClient retries network errors and 429/5xx; answers of the wrong type or missing raise LLMError. The guard fails open on LLMError: the text is allowed on the rules alone and the result's method records that the model was unavailable. A document with more chunks than max_document_chunks is not sent at all and is flagged as too long to check. The rules run first; a rule hit on an answer blocks it without calling Jev."},{"_locs":[{"doc":"Score one answer on three rubric items in ONE Jev request. Returns None if that fails.","file":"src/interview_app/evaluation/live.py","line":65,"params":["decider","rubric","category","question","answer","jd_text","cv_text","cover_letter_text"],"symbol":"interview_app.evaluation.live:live_score"},{"doc":"Live scores for the answer to the latest interviewer turn, or None if scoring is off or fails.","file":"src/interview_app/interview/engine.py","line":525,"params":["deps","row","turns","text"],"symbol":"interview_app.interview.engine:_live_feedback"}],"config":"Settings.models.jev (env MODELS__JEV); switched by Settings.features.live_scoring (env FEATURES__LIVE_SCORING); item choice from rubric.json weights (live_items, LIVE_ITEMS = 3).","cost":"About $0.00002 and 0.4 s per answer according to the module docstring (not re-measured here).","id":"model-live-score-jev","input":"No template file: questions come straight from docs/rubric.json — each item's instructions (which start with the shared prefix describing the state fields) and its five level criteria. State: jd_requirements (the JD text), cv, cover_letter, exchange {question, answer}.","kind":"model","logging":"LLMCall rows with role 'live_score', bound to the session through make_decider.","message":["POST Decisions API body: model, state, questions — one 'score' question per chosen rubric item (e.g. A3, A4, A2 for EXP), all in one request"],"name":"Model role: live answer scoring (Jev)","output":"ScoreAnswer per item: score on the 1-5 scale (the API's 0-based score + 1), probabilities per level, confidence.","purpose":"In coaching mode, scores each answer right away on the three highest-weighted rubric items for its question category, so the candidate can retry before moving on. Fast and cheap by design; the final judge still runs at the end.","result_use":"LiveFeedback (item scores plus a tip built in code by build_tip from the next rubric level) is stored in Turn.live_json and shown with Retry / Continue.","symbols":["interview_app.evaluation.live:live_score","interview_app.interview.engine:_live_feedback"],"validation":"Scores are clamped to 1-5 and rounded half up to a level. Any LLMError returns None: the interview continues without live scores."},{"_locs":[{"doc":"The candidate's next reply to the last interviewer turn in `transcript`.","file":"src/interview_app/lab/candidate.py","line":109,"params":["llm","persona","documents","transcript"],"symbol":"interview_app.lab.candidate:simulate_answer"},{"doc":"Roles are mirrored compared with the interviewer's view: here the *interviewer* is the `user` and the simulated candidate's own earlier answers are `assistant` turns.","file":"src/interview_app/lab/candidate.py","line":97,"params":["persona","documents","transcript"],"symbol":"interview_app.lab.candidate:candidate_messages"},{"doc":"The simulator's instructions. The CV and cover letter are wrapped as data, like everywhere else.","file":"src/interview_app/lab/candidate.py","line":81,"params":["persona","documents"],"symbol":"interview_app.lab.candidate:candidate_system_prompt"}],"config":"Settings.models.candidate_sim (env MODELS__CANDIDATE_SIM); temperature SIM_TEMPERATURE (0.7) in code.","cost":"Not measured separately; part of the lab run's spend checked against --budget-usd.","id":"model-candidate-sim","input":"prompts/candidate_sim.md. Variables: data_note, documents (JD, CV and cover letter wrapped as untrusted data), persona_instructions (PERSONA_INSTRUCTIONS in code), min_words / max_words (WORD_RANGE per persona).","kind":"model","logging":"LLMCall rows with role 'candidate_sim', billed to the same session so the log shows the full cost of a lab run.","message":["system: the rendered candidate_sim.md","user / assistant, alternating: roles mirrored — interviewer turns are user, the simulator's own earlier answers are assistant"],"name":"Model role: simulated candidate (lab)","output":"Plain text: the candidate's next spoken reply (no schema).","purpose":"Plays a fixed candidate persona (strong, weak or evasive) in lab runs, so the interviewer prompts can be compared on the same candidate behaviour. Uses a different model family from the interviewer so the conversation does not look smoother than a real one.","result_use":"Passed to interview_app.interview.engine:answer as if a person had typed it.","symbols":["interview_app.lab.candidate:simulate_answer","interview_app.lab.candidate:candidate_messages","interview_app.lab.candidate:candidate_system_prompt"],"validation":"Surrounding quotes are stripped. The reply then goes through the same guards as a human answer (engine.answer); if a guard blocks it, run_session re-simulates once, and a second block ends the session and is counted in the results."},{"_locs":[{"doc":"All eight judgement items in one Jev request (cheaper and faster than eight requests).","file":"src/interview_app/lab/judge.py","line":219,"params":["decider","data"],"symbol":"interview_app.lab.judge:judge_session"},{"doc":"What Jev reads. Missing documents are left out (not sent as empty strings) so Jev doesn't treat 'no cover letter' as evidence of anything.","file":"src/interview_app/lab/judge.py","line":198,"params":["data"],"symbol":"interview_app.lab.judge:judge_state"}],"config":"Settings.models.jev (env MODELS__JEV); YES_THRESHOLD (0.5) and the gate limits are constants in interview_app.lab.judge.","cost":"Per-call cost reported by the API and written to the CSV as judge_cost_usd.","id":"model-lab-judge-jev","input":"No template file: the questions are SCORE_ITEMS and NOUL_ITEMS in interview_app.lab.judge, each prefixed with a shared _CONTEXT sentence. State from judge_state: role, company, interview_type, the documents that exist (job_description, cv, cover_letter, company_notes — missing ones left out), transcript [{turn, speaker, text}] without superseded attempts.","kind":"model","logging":"LLMCall rows with role 'lab_judge' in the lab database (bound to the lab user, not to a session).","message":["POST Decisions API body: model, state, questions — three 'score' and five 'noul' questions in one request"],"name":"Model role: lab judge of the interviewer (Jev)","output":"JudgeResult: scores {I1, I3, I9} on 1-5, p_yes {I2, I5, I6, I7, I10}, cost_usd and latency_s from the call record.","purpose":"Judges the interviewer (not the candidate) on a finished lab transcript, rubric §12: three 1-5 scores (I1 groundedness, I3 follow-up quality, I9 realism) and five yes/no probabilities (I2 fabrication, I5 leakage or coaching, I6 illegal question, I7 question stacking, I10 role break), all in one request.","result_use":"Combined with code_metrics into one CSV row per session; release_gate turns all results of one variant into a pass/fail with reasons.","symbols":["interview_app.lab.judge:judge_session","interview_app.lab.judge:judge_state"],"validation":"DecisionClient retries and type checks; an LLMError fails that session only, and run_arms reports and skips it."}],"rules":[{"sources":37,"text":"The core (src/interview_app) never imports Streamlit or the UI package app (CLAUDE.md: the core must not import Streamlit, so it stays testable and the UI can be replaced).","violations":[]},{"sources":48,"text":"Only the LLM access layer talks to model APIs: no other module imports openai or httpx (CLAUDE.md: all model calls go through llm/client.py or llm/decide.py, and every call is recorded as an LLMCall row).","violations":[]},{"sources":46,"text":"The product never depends on the lab: the lab drives the engine from outside, the app never imports it.","violations":[]},{"sources":8,"text":"Pages never build model clients themselves: app.ui_common wires LLMClient and DecisionClient with a call-log recorder, so every model call a page triggers is recorded as an LLMCall row (CLAUDE.md: all model calls go through llm/client.py or llm/decide.py and are recorded). Pages may still read the price catalog for the model picker.","violations":[]},{"sources":3,"text":"History, journey and usage only read stored results and never call a model (history.py: 'no model is called'; History never re-runs the judge).","violations":[]},{"sources":5,"text":"The LLM access layer sits at the bottom: it knows config, pricing and the call log table, never the interview, evaluation, security or history logic built on top of it.","violations":[]},{"sources":5,"text":"The security guards do not depend on the interview engine or the evaluation, so they can check any untrusted text (documents, answers, lab answers) the same way.","violations":[]},{"sources":4,"text":"Storage and config are the foundation: they never import the engine, the evaluation or the guards. (preferences imports interview.persona only for the SessionConfig types.)","violations":[]}],"shortPrefix":"","startSymbol":"app.views.applications","storeName":"database","summary":{"call_sites":2187,"classes":103,"external_sites":23,"files":53,"functions":212,"gateway_sites":0,"graph_coverage":0.9505,"import_cycles":1,"inferred_edges":2,"internal_edges":749,"lazy_import_cycles":0,"lines":7596,"methods":41,"orm_models":8,"override_edges":0,"parse_errors":0,"profiles":{"llm":11,"ui":30},"reference_edges
