[project]
name = "interview-app"
version = "0.1.0"
description = "Mock-interview practice app: a grounded LLM interviewer, live Jev scoring and an LLM-judge report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real external API (needs keys; skipped in CI)"]
addopts = "-ra"
